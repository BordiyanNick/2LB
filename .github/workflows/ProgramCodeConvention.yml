name: Program Code Convention Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Super-Linter (Python only)
        # використовуйте офіційний репозиторій
        uses: github/super-linter@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_PYTHON: true
          # простий REGEX: шлях всередині репо
          FILTER_REGEX_INCLUDE: "^2\\.6-GitHubActions/ProgramCode\\.py$"
          IGNORE_GITIGNORED_FILES: true
