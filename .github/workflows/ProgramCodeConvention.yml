name: Program Code Debug Lint

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  debug_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show python version
        run: python3 --version

      - name: Install linters
        run: |
          python3 -m pip install --upgrade pip
          pip install flake8 pylint

      - name: Run flake8
        run: |
          echo "=== flake8 output ==="
          flake8 2.6-GitHubActions/ProgramCode.py || true

      - name: Run pylint
        run: |
          echo "=== pylint output ==="
          pylint 2.6-GitHubActions/ProgramCode.py || true
