name: Program Code Convention Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_python_code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Super-Linter
        uses: github/super-linter@v5
        env:
          VALIDATE_PYTHON: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_INCLUDE: "2.6-GitHubActions/ProgramCode.py"
