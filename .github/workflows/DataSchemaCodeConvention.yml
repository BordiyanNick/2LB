name: Data Schema Code Convention Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sql_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Python and SQLFluff
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install sqlfluff

      - name: Run SQLFluff Linter
        run: |
          echo "🔍 Перевірка SQL-схеми даних..."
          sqlfluff lint 2.6-GitHubActions/DataSchema.sql --dialect postgres || true
