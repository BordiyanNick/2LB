name: SQLFluff Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_sql_schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Lint SQL schema
        run: |
          echo "🔍 Linting DataSchema (Postgres dialect)..."
          sqlfluff lint $GITHUB_WORKSPACE/2.6-GitHubActions/DataSchema.sql --dialect postgres
