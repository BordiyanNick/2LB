# .github/workflows/PrintSoftwareVersions.yml

name: Print Software Versions (Lab 4, Task 2.2.1)

on:
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # Перша робота: Рівень обробки даних (Business Logic Layer)
  # ----------------------------------------------------
  bl_versions:
    name: BL - Java/Spring/Tomcat Versions
    runs-on: ubuntu-latest
    
    steps:
      # *** КРОК ВИПРАВЛЕННЯ 1: Налаштування Java та Maven ***
      # Це забезпечує наявність команд 'java' та 'mvn'
      - name: Setup Java and Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Типова версія для сучасного Spring Boot
          cache: 'maven'
          
      - name: 1. Display Java Version (for Spring Boot/Tomcat)
        run: |
          echo "=== Версія Java (використовується Spring Boot та Tomcat) ==="
          java --version
          
      - name: 2. Display OS Version (Linux)
        run: |
          echo "=== Версія Операційної Системи (Linux) ==="
          cat /etc/os-release
          
      - name: 3. Display Maven Version (типовий інструмент збірки Java)
        run: |
          echo "=== Версія Maven ==="
          # 'mvn' тепер має працювати
          mvn --version
  
  # ----------------------------------------------------
  # Друга робота: Рівень доступу до даних (Access Layer)
  # ----------------------------------------------------
  al_versions:
    name: AL - PostgreSQL Version
    runs-on: ubuntu-latest
    
    steps:
      # *** КРОК ВИПРАВЛЕННЯ 2: Встановлення psql client ***
      # Потрібно встановити psql, щоб команда 'psql' була знайдена
      - name: Install PostgreSQL Client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
      - name: 1. Display PostgreSQL Client Version
        run: |
          echo "=== Версія Клієнта PostgreSQL (psql) ==="
          # 'psql' тепер має працювати
          psql --version
          
      # *** КРОК ВИПРАВЛЕННЯ 3: Використання Docker-контейнера для сервера ***
      - name: 2. Display PostgreSQL Server Version via Docker
        run: |
          echo "=== Версія Сервера PostgreSQL (через Docker-контейнер) ==="
          # Запуск тимчасового контейнера PostgreSQL і виконання запиту
          docker run --rm -e POSTGRES_HOST_AUTH_METHOD=trust postgres:latest psql -c "SELECT version();"
