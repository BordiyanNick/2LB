name: Print Software Versions (Lab 4, Task 2.2.1)

on:
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # Перша робота: Рівень обробки даних (Business Logic Layer)
  # ----------------------------------------------------
  bl_versions:
    name: BL - Java/Spring/Tomcat Versions
    runs-on: ubuntu-latest
    
    steps:
      # 0. Обов'язковий крок для доступу до репозиторію
      - name: Checkout code
        uses: actions/checkout@v4 
        
      # 1. Налаштування Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 1. Display Java Version (for Spring Boot/Tomcat)
        run: |
          echo "=== Версія Java (використовується Spring Boot та Tomcat) ==="
          java --version
          
      - name: 2. Display OS Version (Linux)
        run: |
          echo "=== Версія Операційної Системи (Linux) ==="
          cat /etc/os-release
          
      - name: 3. Display Maven Version
        run: |
          echo "=== Версія Maven ==="
          mvn --version
  
  # ----------------------------------------------------
  # Друга робота: Рівень доступу до даних (Access Layer)
  # ----------------------------------------------------
  al_versions:
    name: AL - PostgreSQL Version
    runs-on: ubuntu-latest
    
    steps:
      # 0. Обов'язковий крок для доступу до репозиторію
      - name: Checkout code
        uses: actions/checkout@v4 
        
      # Встановлення psql client
      - name: Install PostgreSQL Client (psql)
        run: |
          sudo apt update
          sudo apt install -y postgresql-client
          
      - name: 1. Display PostgreSQL Client Version
        run: |
          echo "=== Версія Клієнта PostgreSQL (psql) ==="
          psql --version
          
      - name: 2. Display PostgreSQL Server Version via Docker
        run: |
          echo "=== Версія Сервера PostgreSQL (з образу Docker) ==="
          # Просто запускаємо бінарний файл сервера з прапором --version
          docker run --rm postgres:latest postgres --version
