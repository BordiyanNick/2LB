name: Java Code Convention Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Checkstyle
        run: |
          sudo apt-get update
          sudo apt-get install -y checkstyle

      - name: Run Checkstyle
        run: |
          echo "=== Running Java Code Style Check ==="
          checkstyle -c /usr/share/checkstyle/sun_checks.xml 2.6-GitHubActions/src/com/example/ProgramCode.java
